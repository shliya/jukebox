<!doctype html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>點歌機</title>
    </head>
    <body>
        <!-- 票券登入 -->
        <main id="loginView" class="login-page" hidden>
            <form id="loginForm" class="card login-card">
                <h1 class="login-title">點歌機</h1>
                <p class="login-hint">輸入票券上的票券碼開始點歌</p>
                <label class="field">
                    <span class="label">票券碼</span>
                    <input
                        id="ticketCode"
                        class="input ticket-input"
                        autocomplete="off"
                        autocapitalize="characters"
                        spellcheck="false"
                        maxlength="64"
                        placeholder="XXXXX-XXXXX"
                        required
                    />
                </label>
                <button id="loginBtn" class="btn btn-primary" type="submit">
                    登入
                </button>
                <p id="loginMessage" class="form-message" role="alert"></p>
            </form>
        </main>

        <!-- 登入後 -->
        <main id="mainView" class="page" hidden>
            <header class="room-header">
                <div>
                    <h1 id="roomName" class="room-name"></h1>
                    <span id="roomStatus" class="room-status"></span>
                </div>
                <div class="ticket-box">
                    <span id="ticketLabel" class="ticket-label"></span>
                    <button id="logoutBtn" class="btn" type="button">
                        登出
                    </button>
                </div>
            </header>

            <div class="layout">
                <section class="card">
                    <div id="votedSection" class="voted-box" hidden>
                        <span class="label">你目前點的歌</span>
                        <p id="votedSong" class="voted-song"></p>
                        <p class="voted-hint">
                            一張票只算一首，想換歌直接從下面改選
                        </p>
                    </div>

                    <div>
                        <h2 id="voteTitle" class="card-title">選一首歌</h2>
                        <input
                            id="searchInput"
                            class="input"
                            type="search"
                            placeholder="搜尋歌名或歌手"
                            maxlength="50"
                            aria-label="搜尋歌曲"
                        />
                        <ul id="songList" class="song-list"></ul>
                        <div class="vote-bar">
                            <span id="selectedSong" class="selected-song"
                                >尚未選擇</span
                            >
                            <button
                                id="voteBtn"
                                class="btn btn-primary"
                                type="button"
                                disabled
                            >
                                點這首
                            </button>
                        </div>
                        <p
                            id="voteMessage"
                            class="form-message"
                            role="alert"
                        ></p>
                    </div>
                </section>

                <section class="card">
                    <h2 class="card-title">點歌排行榜</h2>
                    <ol id="rankingList" class="rank-list"></ol>
                </section>
            </div>
        </main>
    </body>
</html>
