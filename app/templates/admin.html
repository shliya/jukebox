<!doctype html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex" />
        <title>點歌機管理</title>
    </head>
    <body>
        <main class="page">
            <header class="room-header">
                <h1 id="roomName" class="room-name">點歌機管理</h1>
                <form id="tokenForm" class="token-form">
                    <input
                        id="tokenInput"
                        class="input"
                        type="password"
                        placeholder="Admin Token"
                        aria-label="Admin Token"
                        autocomplete="off"
                    />
                    <button class="btn" type="submit">儲存</button>
                </form>
            </header>

            <p
                id="overviewMessage"
                class="form-message is-error"
                role="alert"
            ></p>

            <div class="stats">
                <div class="stat">
                    <span class="stat-label">票券總數</span>
                    <span id="statTotal" class="stat-value">-</span>
                </div>
                <div class="stat">
                    <span class="stat-label">已登入</span>
                    <span id="statLoggedIn" class="stat-value">-</span>
                </div>
                <div class="stat">
                    <span class="stat-label">已點歌</span>
                    <span id="statVoted" class="stat-value">-</span>
                </div>
            </div>

            <div class="layout">
                <section class="card">
                    <h2 class="card-title">點歌排行榜</h2>
                    <ol id="rankingList" class="rank-list"></ol>
                </section>

                <section class="card">
                    <h2 class="card-title">新增歌曲</h2>
                    <form id="songForm" class="form">
                        <label class="field">
                            <span class="label">歌名</span>
                            <input
                                id="songTitle"
                                class="input"
                                maxlength="200"
                                required
                            />
                        </label>
                        <label class="field">
                            <span class="label">歌手</span>
                            <input
                                id="songArtist"
                                class="input"
                                maxlength="100"
                            />
                        </label>
                        <label class="field">
                            <span class="label">長度（秒）</span>
                            <input
                                id="songDuration"
                                class="input"
                                type="number"
                                min="0"
                                step="1"
                            />
                        </label>
                        <button class="btn btn-primary" type="submit">
                            新增
                        </button>
                        <p
                            id="songMessage"
                            class="form-message"
                            role="status"
                        ></p>
                    </form>
                </section>
            </div>
        </main>
    </body>
</html>
